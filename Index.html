<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Communiqué</title>
<style>
*{box-sizing:border-box}
body{background:#0b141a;color:#e9edef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;display:flex;flex-direction:column;height:100dvh}
.chat-header{padding:12px 16px;background:#202c33;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2f3b43;gap:8px}
.header-title{font-size:16px;font-weight:600}
.connect-btn{background:#005c4b;color:#e9edef;border:0;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer}
.connect-btn.active{background:#ca8a04}.connect-btn.connected{background:#008069}
.chat-container{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background-image:radial-gradient(#1f2c34 1px,transparent 1px);background-size:20px 20px}
.message{max-width:85%;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.message.received{background:#202c33;align-self:flex-start;border-top-left-radius:0}
.message.sent{background:#005c4b;align-self:flex-end;border-top-right-radius:0}
.message.system{background:#182229;color:#a7b3ba;align-self:center;font-size:12px;border-radius:6px;text-align:center;max-width:95%}
.chat-input-area{display:flex;padding:10px 16px;background:#202c33;align-items:center;gap:10px}
.chat-input-area input{min-width:0;flex:1;padding:12px 16px;background:#2a3942;border:0;border-radius:24px;color:#e9edef;font-size:14px;outline:none}
.chat-input-area input::placeholder{color:#8696a0}
.action-btn{background:#00a884;color:white;border:0;border-radius:50%;width:42px;height:42px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.action-btn:disabled{opacity:.45}.mic-btn{background:transparent;color:#c4cdd2;font-size:20px}.mic-btn.recording{background:#b42318;color:white}
.audio-btn{background:#00a884;color:white;border:0;border-radius:18px;padding:7px 12px;margin-top:7px;cursor:pointer}
</style>
</head>
<body>
<header class="chat-header">
  <span class="header-title">Pixel Communiqué</span>
  <button class="connect-btn" id="phantomBtn">📡 Signal Fantôme</button>
</header>
<main class="chat-container" id="chatBox">
  <div class="message received">Bienvenue. Appuie sur « Signal Fantôme » pour lancer la connexion[span_2](start_span)[span_2](end_span).</div>
</main>
<footer class="chat-input-area">
  <button class="action-btn mic-btn" id="micBtn" title="Enregistrer ou envoyer un vocal">🎤</button>
  <input type="text" id="msgInput" placeholder="Tapez un message..." disabled>
  <button class="action-btn" id="sendBtn" disabled>➤</button>
</footer>
<script>
const phantomBtn=document.getElementById('phantomBtn');
const chatBox=document.getElementById('chatBox');
const msgInput=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');
const micBtn=document.getElementById('micBtn');
let isConnected=false,isScanning=false,isRecording=false;

const isAndroidApp = typeof Android !== 'undefined';

function appendMessage(text,type){
  const d=document.createElement('div');
  d.className='message '+type;
  d.textContent=text;
  chatBox.appendChild(d);
  chatBox.scrollTop=chatBox.scrollHeight;
}
function systemMessage(text){appendMessage(text,'system')}
function scanState(on){
  isScanning=on;
  if(!isConnected){
    phantomBtn.className='connect-btn'+(on?' active':'');
    phantomBtn.textContent=on?'🔍 Recherche en cours…':'📡 Signal Fantôme';
  }
}
function connected(ok){
  isConnected=ok;
  msgInput.disabled=!ok;
  sendBtn.disabled=!ok;
  phantomBtn.className='connect-btn'+(ok?' connected':(isScanning?' active':''));
  phantomBtn.textContent=ok?'🟢 Connecté':'📡 Signal Fantôme';
}
function receiveMessage(text){appendMessage(text,'received')}
function voiceSent(){appendMessage('🎤 Message vocal envoyé','sent')}
function voiceReceived(){
  const d=document.createElement('div');
  d.className='message received';
  d.appendChild(document.createTextNode('🎤 Message vocal reçu'));
  const b=document.createElement('button');
  b.className='audio-btn';
  b.textContent='▶ Écouter';
  b.onclick=()=> {
    if(isAndroidApp) Android.playLastVoice();
    else alert("Lecture audio simulée.");
  };
  d.appendChild(document.createElement('br'));
  d.appendChild(b);
  chatBox.appendChild(d);
  chatBox.scrollTop=chatBox.scrollHeight;
}
function recordingChanged(on){
  isRecording=on;
  micBtn.classList.toggle('recording',on);
  micBtn.textContent=on?'■':'🎤';
}

phantomBtn.addEventListener('click',()=>{
  if(isConnected){systemMessage('Tu es déjà connecté.');return}
  if(!isScanning){
    scanState(true);
    if(isAndroidApp) {
      Android.startScan();
    } else {
      systemMessage('Recherche simulée (Mode navigateur)...');
      setTimeout(()=>{
        scanState(false);
        connected(true);
        systemMessage('Connecté avec succès en mode test !');
      }, 1200);
    }
  } else {
    if(isAndroidApp) Android.stopScan();
    else { scanState(false); systemMessage('Recherche arrêtée.'); }
  }
});

function sendMessage(){
  const text=msgInput.value.trim();
  if(!text||!isConnected)return;
  appendMessage(text,'sent');
  msgInput.value='';
  if(isAndroidApp) {
    Android.sendMessage(text);
  } else {
    setTimeout(()=>receiveMessage("Écho de test : " + text), 1000);
  }
}

sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});

micBtn.addEventListener('click',()=>{
  if(!isConnected){systemMessage('Connecte d’abord l’appareil.');return}
  if(isAndroidApp) {
    if(!isRecording) Android.startRecording();
    else Android.stopAndSendVoice();
  } else {
    recordingChanged(!isRecording);
    if(!isRecording) {
      voiceSent();
      setTimeout(voiceReceived, 1500);
    } else {
      systemMessage('Enregistrement vocal en cours...');
    }
  }
});
</script>
</body>
</html>
